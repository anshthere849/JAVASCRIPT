<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      // we use `cart quantity: ${cartQuantity}` cause we dont want every time it show 0 we want to show the current value of cartQuantity  
      console.log(`cart quantity: ${cartQuantity}
      `);
      ">show quantity</button>
      
    <button onclick="
      cartQuantity = cartQuantity + 1;
      console.log(`cart quantity: ${cartQuantity}
      `);
    ">add to cart</button>

    <button onclick="
      cartQuantity += 2;
      console.log(`cart quantity: ${cartQuantity}
      `);
    ">+2</button>

    <button onclick="
      cartQuantity = cartQuantity + 3;
      console.log(`cartQuantity: ${cartQuantity}
      `);           
    ">+3</button>

    <button onclick="
      cartQuantity = 0;
      console.log('cart was reset');
      console.log(`cartQuantity: ${cartQuantity}
      `);
    ">reset cart</button>

    <script>
      let cartQuantity = 0;
    </script>
  </body>
</html>
