<!DOCTYPE html>
<html>
  <head>
    <style>
      /*
      this css syntax for comments.
      */
      .red-button {
        background-color: red;
        color: white;
        border: none; 
      }
      .green-button {
        background-color: green;
      }
      .yellow-button {
        background-color: yellow;
      }
    </style>
  </head>

  <body>
    <!--
    this is html syntax for comments 
    -->
    <button 
      title="tooltip" 
      class="red-button"
      onclick="alert('good job');">
      HELLO
    </button>

    <button 
      class="yellow-button"
      onclick="alert('ding dong');">
      TAP ME!
    </button>

    <p>
    paragraph <button class="green-button">HELLO</button> of text
    </p>

    <script>
      // this is a comment
      // if you type double slashes, it will comment out the rest of the line this single line comment

      /*
      this is another syntax to write comments. most of the time we use the double slashes, but if you want to comment out multiple lines, you can use this syntax.
      */

      // alert('hello');
      // if we wanna do some math the result of that math will not be show in console until you use this code
      
       console.log(2 + 2);
       console.log('we can also type strings in this code and it will appear in the console');

    </script>
  </body>
</html>
